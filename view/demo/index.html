<style>
  :root { --iswc-font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--iswc-bg); color: var(--iswc-text); font-family: var(--iswc-font-sans, "Inter", ui-sans-serif, system-ui, sans-serif); }
  .app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  .barra { display: flex; align-items: center; gap: 0.75em; padding: 0.5em 1em; border-bottom: 1px solid var(--iswc-border-soft); background: var(--iswc-surface, var(--iswc-bg)); }
  .barra .marca { font-weight: 700; letter-spacing: 0.01em; }
  .barra .plugin { font-size: 0.8em; color: var(--iswc-text-muted, var(--iswc-text)); }
  .barra .plugin a { color: var(--iswc-brand, inherit); }
  .barra .espacio { flex: 1; }
  #menu { display: none; }
  .cuerpo { min-height: 0; --min: 12%; --max: 40%; }
  nav { display: grid; align-content: start; gap: 0.25em; padding: 0.75em; height: 100%; box-sizing: border-box; overflow: auto; }
  nav iswc-button { display: block; }
  nav iswc-button::part(button) { width: 100%; justify-content: flex-start; text-align: start; }
  nav iswc-button[aria-current="true"] { --iswc-button-bg: var(--iswc-brand-soft); font-weight: 600; }
  iswc-preview-component { height: 100%; }
  @media (max-width: 48em) { #menu { display: inline-flex; } }
